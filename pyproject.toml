[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sunproof"
version = "1.0.0"
description = "SunProof — Prosumer & Grid Intelligence Engine for Energy Suppliers"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "fpdf2>=2.7.8",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["sunproof*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
