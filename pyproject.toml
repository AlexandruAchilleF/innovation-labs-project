[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunproof"
version = "0.1.0"
description = "Cutia neagră a prosumatorului: un singur adevăr despre energia ta, care îți aparține."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.38",
    "pydeck>=0.9",
    "matplotlib>=3.8",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sunproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
