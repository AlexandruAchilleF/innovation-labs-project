<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=block" rel="stylesheet" />
<!--
  Frame compositor for scripts/record-demo.mjs. window.draw(state, plates) is a pure function of the
  state the director computes per frame: no CSS transitions, no timers, no randomness.
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  * { box-sizing: border-box; }
  #frame { position: absolute; inset: 0; overflow: hidden; background: #111; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #bg { position: absolute; left: -1400px; top: -900px; width: 4720px; height: 2880px;
    background: radial-gradient(1200px 900px at 50% 45%, #1e1e1e 0%, #151515 55%, #101010 100%); }
  #bg svg { position: absolute; left: 1400px; top: 900px; overflow: visible; }
  #glow { position: absolute; left: 2620px; top: 520px; width: 1100px; height: 800px; filter: blur(110px); opacity: .55;
    background: radial-gradient(closest-side at 35% 60%, #d4a35a 0%, rgba(212,163,90,0) 70%),
                radial-gradient(closest-side at 70% 35%, #2b7fff 0%, rgba(43,127,255,0) 70%); }
  .dev { position: absolute; }
  .dev .screen { position: absolute; inset: 0; overflow: hidden; background: #181818; }
  .dev img { position: absolute; display: block; max-width: none; }
  .dev.desktop .screen { box-shadow: 0 0 0 1px #2e2e2e, 0 50px 140px rgba(0,0,0,.6); }
  .dev.phone .screen { box-shadow: 0 0 0 14px #060606, 0 0 0 15.5px #303030, 0 60px 140px rgba(0,0,0,.7); }
  .dev.phone .cam { position: absolute; left: 50%; top: -9px; width: 54px; height: 5px; margin-left: -27px; border-radius: 3px; background: #1b1b1b; }
  #overlay { position: absolute; inset: 0; }
  #grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: screen; }
  #veil { position: absolute; inset: 0; }
  #cursor { position: absolute; left: 0; top: 0; transform-origin: 6px 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid #d4a35a; }
  .flash { position: absolute; border-radius: 10px; border: 2px solid #d4a35a; }
  #co { position: absolute; left: 0; top: 0; max-width: 620px; padding: 16px 22px 17px; border-radius: 14px; background: #eeeeee;
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.08); font-family: Inter, sans-serif; white-space: normal; }
  #co .main { font-weight: 600; font-size: 30px; line-height: 1.22; letter-spacing: -.012em; color: #111; }
  #co .sub { margin-top: 8px; font-family: "Fira Code", monospace; font-weight: 500; font-size: 20px; line-height: 1.3; color: #4a4a4a; }
  #co .sub:empty { display: none; }
  #co span { display: inline-block; white-space: pre; }
  #card { position: absolute; left: 0; top: 0; width: 360px; padding: 16px 18px; border-radius: 12px; background: #1f1f1f;
    border: 1px solid #3a3a3a; box-shadow: 0 24px 60px rgba(0,0,0,.6); font-family: Inter, sans-serif; color: #eee; transform-origin: 50% 50%; }
  #card .k { font-family: "Fira Code", monospace; font-size: 14px; color: #d4a35a; }
  #card .t { margin-top: 6px; font-size: 19px; font-weight: 600; }
  #card .s { margin-top: 4px; font-size: 14px; color: #a4a19b; }
  #title { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #title .m { font-family: "Libre Baskerville", serif; font-size: 132px; color: #eee; letter-spacing: -.01em; }
  #title .s { margin-top: 26px; font-family: Inter, sans-serif; font-size: 32px; color: #a4a19b; }
  #title span { display: inline-block; white-space: pre; }
  #black { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <div id="bg">
      <div id="glow"></div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke="rgba(238,238,238,.10)" stroke-width="1.5">
        <!-- transformer symbol: two overlapping windings -->
        <circle cx="1360" cy="300" r="250" /><circle cx="1610" cy="300" r="250" />
        <line x1="-1400" y1="300" x2="3300" y2="300" /><line x1="-1400" y1="830" x2="3300" y2="830" />
        <line x1="300" y1="-900" x2="300" y2="2000" /><line x1="1610" y1="-900" x2="1610" y2="2000" />
        <line x1="-600" y1="1700" x2="2400" y2="-700" /><line x1="-400" y1="-500" x2="2600" y2="1900" />
        <g id="sparks" fill="rgba(238,238,238,.55)" stroke="none"></g>
      </svg>
    </div>
    <div id="devs"></div>
  </div>
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="overlay">
    <div id="flashes"></div>
    <div id="ripples"></div>
    <div id="card"><div class="k"></div><div class="t"></div><div class="s"></div></div>
    <div id="co"><div class="main"></div><div class="sub"></div></div>
    <svg id="cursor" width="64" height="64" viewBox="0 0 28 28">
      <path d="M5 3l17 9.5-7.4 1.6 4.3 8.2-3.3 1.7-4.3-8.2L5.6 21z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
    </svg>
    <div id="title"><div class="m"></div><div class="s"></div></div>
  </div>
  <div id="veil"></div>
  <div id="black"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <filter id="mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="mbg" stdDeviation="0 0" /></filter>
</svg>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const mix = (a, b, k) => a.map((x, i) => Math.round(x + (b[i] - x) * k));

  // seeded grain: 6 noise tiles generated once, picked by frame number
  const grains = [];
  (() => {
    let s = 1337;
    const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let t = 0; t < 6; t++) {
      const c = document.createElement("canvas");
      c.width = 960; c.height = 540;
      const g = c.getContext("2d"), im = g.createImageData(960, 540);
      for (let i = 0; i < im.data.length; i += 4) {
        const v = rnd() * 255;
        im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
      }
      g.putImageData(im, 0, 0);
      grains.push(c);
    }
    const spark = (x, y, r) =>
      `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z"/>`;
    $("sparks").innerHTML = [[300, 300, 9], [1610, 300, 11], [300, 830, 8], [1610, 830, 9], [1360, 300, 6]]
      .map((p) => spark(...p)).join("");
  })();

  const devEls = {};
  function devEl(id, kind) {
    if (devEls[id]) return devEls[id];
    const el = document.createElement("div");
    el.className = `dev ${kind}`;
    el.innerHTML = `<div class="screen"><img /></div>${kind === "phone" ? '<div class="cam"></div>' : ""}`;
    $("devs").append(el);
    return (devEls[id] = { el, screen: el.firstChild, img: el.querySelector("img") });
  }

  // words arrive with blur 6 -> 0 px and colour blue -> amber -> ink over ~10 frames
  const BLUE = [43, 127, 255], AMBER = [212, 163, 90];
  function wordsHTML(text, age, ink, step) {
    return text.split(/(\s+)/).map((w, i) => {
      if (/^\s+$/.test(w)) return w;
      const a = age - (i / 2) * step;
      const k = clamp(a / 10);
      const col = k < 0.45 ? mix(BLUE, AMBER, k / 0.45) : mix(AMBER, ink, (k - 0.45) / 0.55);
      return `<span style="opacity:${clamp(a / 3)};filter:blur(${(6 * (1 - clamp(a / 7))).toFixed(2)}px);color:rgb(${col})">${w}</span>`;
    }).join("");
  }

  async function setPlate(id, p) {
    const d = devEls[id];
    if (!p || !d) return;
    if (p.src) {
      d.img.src = p.src;
      await d.img.decode().catch(() => {});
    }
    d.clip = p.clip;
  }

  window.draw = async (st, plates) => {
    await Promise.all(Object.entries(plates).map(([id, p]) => (devEl(id, st.devices[id].kind), setPlate(id, p))));
    const [cx, cy, z] = st.cam;
    $("stage").style.transform = `translate(960px,540px) scale(${z}) translate(${-cx}px,${-cy}px)`;
    $("mbg").setAttribute("stdDeviation", `${st.blur[0].toFixed(2)} ${st.blur[1].toFixed(2)}`);
    $("stage").style.filter = st.blur[0] + st.blur[1] > 0.3 ? "url(#mb)" : "none";

    for (const [id, dv] of Object.entries(st.devices)) {
      const d = devEl(id, dv.kind);
      d.el.style.display = dv.alpha > 0 ? "block" : "none";
      Object.assign(d.el.style, {
        left: `${dv.x}px`, top: `${dv.y}px`, width: `${dv.w * dv.s}px`, height: `${dv.h * dv.s}px`, opacity: dv.alpha,
      });
      d.screen.style.borderRadius = `${dv.radius}px`;
      const c = d.clip;
      if (c) Object.assign(d.img.style, {
        left: `${c.x * dv.s}px`, top: `${c.y * dv.s}px`, width: `${c.width * dv.s}px`, height: `${c.height * dv.s}px`,
      });
    }

    const g = $("grain").getContext("2d");
    g.drawImage(grains[st.f % grains.length], 0, 0);
    $("grain").style.width = "1920px"; $("grain").style.height = "1080px";

    const cu = st.cursor;
    Object.assign($("cursor").style, {
      opacity: cu.alpha,
      transform: `translate(${cu.x - 6}px,${cu.y - 4}px) scale(${(cu.size / 64) * (1 - 0.1 * cu.press)})`,
    });

    $("ripples").innerHTML = st.ripples.map(({ x, y, p }) => {
      const r = 14 + 46 * p;
      return `<div class="ripple" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${(1 - p).toFixed(3)}"></div>`;
    }).join("");
    $("flashes").innerHTML = st.flashes.map(({ x, y, w, h, p }) => {
      const g2 = 4 + 10 * p;
      return `<div class="flash" style="left:${x - g2}px;top:${y - g2}px;width:${w + 2 * g2}px;height:${h + 2 * g2}px;opacity:${(1 - p).toFixed(3)};background:rgba(212,163,90,${(0.22 * (1 - p)).toFixed(3)})"></div>`;
    }).join("");

    const co = $("co"), c = st.callout;
    co.style.display = c ? "block" : "none";
    if (c) {
      co.querySelector(".main").innerHTML = wordsHTML(c.main, c.age, [17, 17, 17], 2);
      co.querySelector(".sub").innerHTML = c.sub ? wordsHTML(c.sub, c.age - 8, [74, 74, 74], 2) : "";
      const w = co.offsetWidth, h = co.offsetHeight;
      let x = c.x + 34, y = c.y + 44;
      if (c.side === "left" || x + w > 1880) x = c.x - w - 22;
      if (y + h > 1050) y = c.y - h - 26;
      x = clamp(x, 30, 1890 - w); y = clamp(y, 30, 1050 - h);
      const k = c.alpha;
      co.style.transform = `translate(${x}px,${y + 10 * (1 - k)}px) scale(${0.96 + 0.04 * k})`;
      co.style.opacity = k;
      co.style.filter = k < 1 ? `blur(${(4 * (1 - k)).toFixed(2)}px)` : "none";
    }

    const card = $("card"), k = st.card;
    card.style.display = k && k.alpha > 0 ? "block" : "none";
    if (k && k.alpha > 0) {
      card.querySelector(".k").textContent = k.kicker;
      card.querySelector(".t").textContent = k.title;
      card.querySelector(".s").textContent = k.sub;
      card.style.opacity = k.alpha;
      card.style.transform = `translate(${k.x - 180}px,${k.y - 50}px) scale(${k.s}) rotate(${k.rot}deg)`;
    }

    const t = st.title;
    $("title").style.display = t ? "flex" : "none";
    if (t) {
      $("title").querySelector(".m").innerHTML = wordsHTML(t.main, t.age, [238, 238, 238], 3);
      $("title").querySelector(".s").innerHTML = wordsHTML(t.sub, t.age - 10, [164, 161, 155], 2);
      $("title").style.opacity = t.alpha;
    }

    $("veil").style.background = `rgba(${st.veil.rgb},${st.veil.a})`;
    $("frame").style.filter = st.veil.blur > 0.05 ? `blur(${st.veil.blur}px)` : "none";
    $("black").style.opacity = st.black;
  };

  window.ready = async () => {
    await Promise.all([
      document.fonts.load('600 30px "Inter"'), document.fonts.load('400 30px "Inter"'),
      document.fonts.load('500 20px "Fira Code"'), document.fonts.load('132px "Libre Baskerville"'),
    ]);
    await document.fonts.ready;
    return document.fonts.check('600 30px "Inter"');
  };
</script>
</body>
</html>
